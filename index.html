<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suika Game - Advanced Bomb Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Helvetica', sans-serif; }
        
        /* UIレイアウト */
        #ui-container { position: absolute; width: 800px; height: 750px; pointer-events: none; z-index: 10; }
        .side-panel { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        
        /* 左側パネル: スコアとボム */
        #left-panel { left: 0; top: 50px; width: 150px; pointer-events: auto; }
        .score-box { background: #fff; border: 4px solid #8b5a2b; border-radius: 15px; width: 100px; padding: 10px; text-align: center; font-weight: bold; }
        
        /* 巨大な正円ボムボタン */
        #bomb-btn { 
            width: 100px; height: 100px; background: #e74c3c; color: white; border: none; 
            border-radius: 50%; border-bottom: 8px solid #c0392b; cursor: pointer; 
            font-size: 18px; font-weight: bold; transition: 0.1s; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: flex; flex-direction: column; justify-content: center;
        }
        #bomb-btn:active { transform: translateY(4px); border-bottom-width: 2px; }
        #bomb-btn.active { background: #f1c40f; border-bottom-color: #f39c12; color: #000; }
        #bomb-btn.disabled { background: #95a5a6; border-bottom-color: #7f8c8d; cursor: not-allowed; }

        /* 右側パネル: 次予告と進化 */
        #right-panel { right: 0; top: 50px; width: 150px; }
        .next-box { background: #fff; border: 4px solid #8b5a2b; border-radius: 15px; width: 80px; padding: 10px; text-align: center; font-weight: bold; }
        #evo-wheel { background: rgba(255, 255, 255, 0.8); border: 4px solid #8b5a2b; border-radius: 50px; padding: 15px; display: flex; flex-direction: column; gap: 8px; align-items: center; margin-top: 20px; }
        .evo-item { border-radius: 50%; border: 1px solid #333; }
    </style>
</head>
<body>

<div id="ui-container">
    <div id="left-panel" class="side-panel">
        <div class="score-box">SCORE<br><span id="score-val">0</span></div>
        <button id="bomb-btn">BOMB<br><span id="bomb-val">1</span></button>
    </div>
    <div id="right-panel" class="side-panel">
        <div class="next-box">NEXT<br><div id="next-preview" style="width:40px;height:40px;margin:5px auto;border-radius:50%;"></div></div>
        <div id="evo-wheel">
            <div style="font-size:12px; font-weight:bold; margin-bottom:5px;">進化</div>
            <!-- 進化の輪を動的に生成 -->
        </div>
    </div>
</div>

<script>
const FRUIT_TYPES = [
    { size: 18, score: 2, color: 0xff4d4d }, { size: 25, score: 4, color: 0xff7675 },
    { size: 32, score: 8, color: 0xa29bfe }, { size: 40, score: 16, color: 0xffab00 },
    { size: 50, score: 32, color: 0xff7f50 }, { size: 60, score: 64, color: 0xd63031 },
    { size: 72, score: 128, color: 0xfffa65 }, { size: 85, score: 256, color: 0xff9ff3 },
    { size: 105, score: 512, color: 0xf1c40f }, { size: 130, score: 1024, color: 0x2ecc71 },
    { size: 160, score: 2048, color: 0x27ae60 }
];

let score = 0, bombCount = 1, nextLevel = Math.floor(Math.random() * 5);
let currentFruit = null, playerCloud = null, canDrop = true, isBombActive = false;
let storedFruitLevel = 0; // ボムキャンセルのために元のフルーツを保存

const config = {
    type: Phaser.AUTO, width: 450, height: 750, backgroundColor: '#fef1d2',
    physics: { default: 'matter', matter: { gravity: { y: 0.8 }, enableSleeping: false, debug: false } },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);

function preload() {}

function create() {
    // 地面と壁の作成（地面に'floor'ラベルを付与）
    this.matter.world.setBounds(0, 0, 450, 750, 32, true, true, false, true);
    const floor = this.matter.add.rectangle(225, 750, 450, 10, { isStatic: true, label: 'floor' });

    // 進化の輪のUI表示
    const evoWheel = document.getElementById('evo-wheel');
    FRUIT_TYPES.forEach(t => {
        const item = document.createElement('div');
        item.className = 'evo-item';
        item.style.width = (t.size/3.5) + 'px';
        item.style.height = (t.size/3.5) + 'px';
        item.style.background = "#" + t.color.toString(16).padStart(6, '0');
        evoWheel.appendChild(item);
    });

    // クラウド（キャラクター）
    playerCloud = this.add.container(225, 60);
    const cloudBody = this.add.ellipse(0, 0, 90, 50, 0xffffff).setStrokeStyle(2, 0xdddddd);
    const eyeL = this.add.circle(-15, -5, 4, 0x333333);
    const eyeR = this.add.circle(15, -5, 4, 0x333333);
    playerCloud.add([cloudBody, eyeL, eyeR]);

    spawnFruit(this);

    // マウス/タッチ移動
    this.input.on('pointermove', (p) => {
        if (canDrop) {
            playerCloud.x = Phaser.Math.Clamp(p.x, 50, 400);
            if (currentFruit) currentFruit.x = playerCloud.x;
        }
    });

    // 離して落下
    this.input.on('pointerup', () => { if (canDrop) dropFruit(this); });

    // ボムボタンのロジック（トグル/キャンセル）
    const btn = document.getElementById('bomb-btn');
    btn.onclick = () => {
        if (isBombActive) {
            // キャンセル：元のフルーツに戻す
            isBombActive = false;
            bombCount++;
            btn.classList.remove('active');
            if (currentFruit) currentFruit.destroy();
            spawnFruit(this, storedFruitLevel);
        } else if (bombCount > 0 && canDrop) {
            // ボム起動
            isBombActive = true;
            storedFruitLevel = currentFruit.level; // 現在のフルーツを記憶
            bombCount--;
            btn.classList.add('active');
            if (currentFruit) currentFruit.destroy();
            spawnFruit(this);
        }
        updateUI();
    };

    // 衝突判定
    this.matter.world.on('collisionstart', (e) => {
        e.pairs.forEach(pair => {
            const a = pair.bodyA;
            const b = pair.bodyB;

            // ボムの衝突処理
            if (a.label === 'bomb' || b.label === 'bomb') {
                const bombBody = (a.label === 'bomb') ? a : b;
                const otherBody = (a.label === 'bomb') ? b : a;

                if (otherBody.label === 'floor') {
                    // 底に触れたら消える
                    if (bombBody.gameObject) bombBody.gameObject.destroy();
                } else if (otherBody.gameObject) {
                    // フルーツに触れたら1つ消して自分も消える
                    otherBody.gameObject.destroy();
                    if (bombBody.gameObject) bombBody.gameObject.destroy();
                    this.cameras.main.shake(150, 0.01);
                }
                return;
            }

            // 通常の合体
            if (a.label === b.label && a.label !== 'floor') {
                mergeFruits(this, a, b);
            }
        });
    });
}

function spawnFruit(scene, forcedLevel = null) {
    const x = playerCloud.x;
    const y = playerCloud.y + 40;
    
    if (isBombActive) {
        currentFruit = scene.add.circle(x, y, 22, 0x000000).setStrokeStyle(3, 0xff0000);
        currentFruit.isBomb = true;
    } else {
        const level = forcedLevel !== null ? forcedLevel : nextLevel;
        const type = FRUIT_TYPES[level];
        currentFruit = scene.add.circle(x, y, type.size, type.color).setStrokeStyle(1, 0x000000, 0.2);
        currentFruit.level = level;
        if (forcedLevel === null) nextLevel = Math.floor(Math.random() * 5);
    }
    
    updateUI();
    canDrop = true;
}

function dropFruit(scene) {
    canDrop = false;
    const x = currentFruit.x, y = currentFruit.y, level = currentFruit.level;
    const isBomb = currentFruit.isBomb;
    
    currentFruit.destroy();
    document.getElementById('bomb-btn').classList.remove('active');

    if (isBomb) {
        const b = scene.matter.add.circle(x, y, 22, { label: 'bomb', friction: 0.1 });
        scene.matter.add.gameObject(scene.add.circle(x, y, 22, 0x000000).setStrokeStyle(3, 0xff0000), b);
        isBombActive = false;
    } else {
        const type = FRUIT_TYPES[level];
        const f = scene.matter.add.circle(x, y, type.size, { label: level.toString(), restitution: 0.3, friction: 0.1 });
        scene.matter.add.gameObject(scene.add.circle(x, y, type.size, type.color).setStrokeStyle(1, 0x000000, 0.2), f);
    }
    
    scene.time.delayedCall(700, () => spawnFruit(scene));
}

function mergeFruits(scene, a, b) {
    const level = parseInt(a.label);
    if (level >= FRUIT_TYPES.length - 1 || !a.gameObject || !b.gameObject) return;
    
    const nx = (a.position.x + b.position.x) / 2;
    const ny = (a.position.y + b.position.y) / 2;
    
    a.gameObject.destroy();
    b.gameObject.destroy();
    
    const next = level + 1;
    const type = FRUIT_TYPES[next];
    const nf = scene.matter.add.circle(nx, ny, type.size, { label: next.toString(), restitution: 0.3 });
    scene.matter.add.gameObject(scene.add.circle(nx, ny, type.size, type.color).setStrokeStyle(1, 0x000000, 0.2), nf);
    
    score += FRUIT_TYPES[level].score;
    if (score > 0 && score % 1000 < 50) { bombCount = Math.min(2, bombCount + 1); }
    updateUI();
}

function updateUI() {
    document.getElementById('score-val').innerText = score;
    document.getElementById('bomb-val').innerText = bombCount;
    const nextP = document.getElementById('next-preview');
    nextP.style.background = "#" + FRUIT_TYPES[nextLevel].color.toString(16).padStart(6, '0');
    
    const btn = document.getElementById('bomb-btn');
    if (bombCount === 0 && !isBombActive) btn.classList.add('disabled');
    else btn.classList.remove('disabled');
}

function update() {}
</script>
</body>
</html>
